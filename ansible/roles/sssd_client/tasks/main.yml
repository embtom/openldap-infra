---
- name: Ensure the LDAP endpoint is configured
  ansible.builtin.assert:
    that:
      - sssd_client_ldap_uri is defined
      - sssd_client_ldap_uri != 'ldaps://'
    fail_msg: >-
      sssd_client_ldap_uri resolves to
      "{{ sssd_client_ldap_uri | default('') }}". Set
      sssd_client_ldap_host to the LDAP server's externally
      resolvable DNS hostname (it must match the name in the LDAPS
      certificate), e.g. by running scripts/configure-sssd-client.py,
      or override sssd_client_ldap_uri directly for advanced setups.
    quiet: true

- name: Install SSSD packages
  ansible.builtin.apt:
    name: "{{ sssd_client_packages }}"
    state: present
    update_cache: true

- name: Enable SSSD NSS lookups
  ansible.builtin.lineinfile:
    path: /etc/nsswitch.conf
    regexp: '^({{ item }}:\s+)(?!.*\bsss\b)(.*)$'
    line: '\1\2 sss'
    backrefs: true
  loop:
    - passwd
    - group

- name: Configure SSSD PAM profiles
  ansible.builtin.command:
    cmd: >-
      /usr/sbin/pam-auth-update --enable sss
      {{ sssd_client_mkhomedir_enabled | bool |
         ternary('mkhomedir', '--disable mkhomedir') }}
      --force
  environment:
    DEBIAN_FRONTEND: noninteractive
  changed_when: false

- name: Install OpenLDAP root CA certificate
  ansible.builtin.copy:
    src: "{{ sssd_client_ca_certificate_source }}"
    dest: "{{ sssd_client_ca_certificate }}"
    owner: root
    group: root
    mode: "0644"
  notify: Update CA certificates

- name: Deploy SSSD configuration
  ansible.builtin.template:
    src: sssd.conf.j2
    dest: /etc/sssd/sssd.conf
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart SSSD

- name: Enable and start SSSD
  ansible.builtin.systemd_service:
    name: sssd
    enabled: true
    state: started

- name: Apply updated SSSD configuration
  ansible.builtin.meta: flush_handlers

- name: Enable SSSD responder socket activation
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - sssd-nss.socket
    - sssd-pam.socket
