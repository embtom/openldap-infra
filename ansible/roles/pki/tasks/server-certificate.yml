---
- name: Validate server certificate request
  ansible.builtin.assert:
    that:
      - pki_server_certificate.name is match('^[A-Za-z0-9._-]+$')
      - pki_server_certificate.common_name | length > 0
      - pki_server_certificate.subject_alt_names | length > 0
    fail_msg: >-
      Each pki_server_certificates entry requires a filesystem-safe name,
      common_name, and at least one subject_alt_names entry.

- name: Create TLS private key for {{ pki_server_certificate.name }}
  community.crypto.openssl_privatekey:
    path: >-
      {{ pki_intermediate_ca_dir ~ '/private/' ~
         pki_server_certificate.name ~ '.key' }}
    type: RSA
    size: 4096
    mode: "0600"
  delegate_to: localhost
  become: false


- name: Create TLS CSR for {{ pki_server_certificate.name }}
  community.crypto.openssl_csr:
    path: >-
      {{ pki_intermediate_ca_dir ~ '/csr/' ~
         pki_server_certificate.name ~ '.csr' }}
    privatekey_path: >-
      {{ pki_intermediate_ca_dir ~ '/private/' ~
         pki_server_certificate.name ~ '.key' }}
    common_name: "{{ pki_server_certificate.common_name }}"
    subject_alt_name: "{{ pki_server_certificate.subject_alt_names }}"
    key_usage:
      - digitalSignature
      - keyEncipherment
    extended_key_usage:
      - serverAuth
  delegate_to: localhost
  become: false

- name: >-
    Sign TLS certificate with intermediate CA for
    {{ pki_server_certificate.name }}
  community.crypto.x509_certificate:
    path: >-
      {{ pki_intermediate_ca_dir ~ '/certs/' ~
         pki_server_certificate.name ~ '.crt' }}
    csr_path: >-
      {{ pki_intermediate_ca_dir ~ '/csr/' ~
         pki_server_certificate.name ~ '.csr' }}
    provider: ownca
    ownca_path: "{{ pki_intermediate_ca_certificate }}"
    ownca_privatekey_path: "{{ pki_intermediate_ca_key }}"
    ownca_not_after: "+3650d"
    ownca_digest: sha256
  delegate_to: localhost
  become: false

- name: Create TLS full chain for {{ pki_server_certificate.name }}
  ansible.builtin.copy:
    content: |
      {{ lookup(
           'ansible.builtin.file',
           pki_intermediate_ca_dir ~ '/certs/' ~
           pki_server_certificate.name ~ '.crt'
         ) }}
      {{ lookup('ansible.builtin.file', pki_intermediate_ca_certificate) }}
    dest: >-
      {{ pki_intermediate_ca_dir ~ '/certs/' ~
        pki_server_certificate.name ~ '-fullchain.crt' }}
    mode: "0644"
  delegate_to: localhost
  become: false
