---
- name: Validate OpenLDAP configuration settings
  ansible.builtin.assert:
    that:
      - openldap_config_admin_password is defined
      - openldap_config_admin_password | length > 0
      - openldap_config_dir is match('^/.+')
      - openldap_config_dir != '/'
    fail_msg: >-
      Set a non-empty openldap_config_admin_password and a non-root absolute
      configuration directory.

- name: Create OpenLDAP service user
  become: true
  ansible.builtin.user:
    name: "{{ openldap_config_user }}"
    comment: OpenLDAP service user
    shell: /bin/bash
    create_home: true
    state: present

- name: Create OpenLDAP configuration directory
  become: true
  ansible.builtin.file:
    path: "{{ openldap_config_dir }}"
    state: directory
    owner: "{{ openldap_config_user }}"
    group: "{{ openldap_config_user }}"
    mode: "0750"

- name: Deploy OpenLDAP configuration
  become: true
  ansible.builtin.template:
    src: slapd.conf.j2
    dest: "{{ openldap_config_file }}"
    owner: "{{ openldap_config_user }}"
    group: "{{ openldap_config_user }}"
    mode: "0600"
  no_log: true

- name: Deploy OpenLDAP bootstrap data
  become: true
  ansible.builtin.template:
    src: bootstrap.ldif.j2
    dest: "{{ openldap_config_bootstrap_file }}"
    owner: "{{ openldap_config_user }}"
    group: "{{ openldap_config_user }}"
    mode: "0600"
  no_log: true
